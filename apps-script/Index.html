<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#fbf7f2;--card:#fff;--ink:#2b2420;--mute:#8a7f76;--line:#eadfd3;--acc:#c0622f;--acc2:#f3e3d6;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#26211d;--ink:#f1e9e1;--mute:#a69a8f;--line:#3a322c;--acc:#e08a55;--acc2:#3a2b21;--on:#1d1916}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line);z-index:5}
.topo{max-width:1100px;margin:0 auto}
h1{margin:0 0 8px;font-size:22px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
#busca{width:100%;padding:10px 12px;border-radius:10px}
.linha{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rot{font-size:12px;color:var(--mute);min-width:72px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
main{padding:16px;max-width:1100px;margin:0 auto}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.card .img{aspect-ratio:4/3;background:var(--acc2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px}
.card .txt{padding:10px 12px}
.card b{display:block;margin-bottom:4px}
.meta{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;background:var(--acc2);border-radius:6px;padding:1px 6px;margin:4px 4px 0 0}
.voltar{background:none;border:0;color:var(--acc);font-size:15px;cursor:pointer;padding:0;margin-bottom:10px}
h2{margin:0 0 4px}
h3.sec{margin:22px 0 10px}
.barra{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;margin:14px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px}
.grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grupo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.grupo h4{margin:0 0 8px;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.grupo ul,.grupo ol{margin:0;padding-left:18px}
.grupo li{margin:5px 0}
.q{font-weight:600}
.obs{color:var(--mute);font-size:13px}
.insta{margin:20px 0;max-width:420px}
.insta iframe{width:100%;height:600px;border:1px solid var(--line);border-radius:12px;background:#fff}
a{color:var(--acc)}
.aviso{font-size:12px;color:var(--mute);margin-top:16px}
.vazio{color:var(--mute);padding:30px 0;text-align:center}
.topo-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.topo-linha h1{margin:0}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--on);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.sec{background:transparent;color:var(--acc)}
.btn:disabled{opacity:.6;cursor:default}
.mini{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:0 4px}
.cab-det{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cab-det .voltar{margin:0}
.form label.c{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.form .campo{width:100%}
.form textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;min-height:60px}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.fgrupo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.fgrupo .gnome{flex:1;font-weight:600}
.fing{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.fing .fq{width:70px}
.fing .fu{width:160px}
.fing .fi{flex:1 1 170px}
.fing .fo{flex:1 1 120px}
.fing label{font-size:13px;color:var(--mute);white-space:nowrap}
.fpasso{display:flex;gap:6px;align-items:flex-start;margin:6px 0}
.fpasso textarea{min-height:44px}
.acoes{display:flex;gap:10px;margin:20px 0;align-items:center;flex-wrap:wrap}
.erro{color:#d0452f;font-size:14px}
.sugs{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header><div class="topo">
  <div class="topo-linha"><h1>🥣 Carbinhos</h1><button class="btn" data-novo>+ Nova receita</button></div>
  <input id="busca" type="search" placeholder="Buscar por nome, ingrediente ou tag…" autocomplete="off">
  <div id="filtros"></div>
</div></header>
<main id="app"><div class="vazio">Carregando receitas…</div></main>

<script>
var D = null;
var ML = {}, NOMES = {};
var estado = { busca: '', tags: [], cat: '', aberta: null, modo: 'original', fator: 1 };
var FR = [[0, ''], [1/8, '⅛'], [1/4, '¼'], [1/3, '⅓'], [1/2, '½'], [2/3, '⅔'], [3/4, '¾'], [1, '']];

function app() { return document.getElementById('app'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

google.script.run
  .withSuccessHandler(function (d) { carregar(d); filtros(); render(); })
  .withFailureHandler(function (e) {
    app().innerHTML = '<div class="vazio">Erro ao carregar: ' + esc(e && e.message) + '</div>';
  })
  .getData();

function carregar(d) {
  D = d; ML = {}; NOMES = {};
  d.unidades.forEach(function (u) { NOMES[u.codigo] = u.nome; if (u.ml) ML[u.codigo] = u.ml; });
}

/* ---------- quantidades e conversão ---------- */
function qtdNum(v) {
  if (typeof v === 'number') return v;
  var s = String(v || '').trim().replace(',', '.');
  if (!s) return null;
  var m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\/(\d+)$/);
  if (m) return m[1] / m[2];
  return isNaN(+s) ? null : +s;
}
function fracao(q) {
  var i = Math.floor(q + 1e-9), f = q - i, best = null;
  FR.forEach(function (p) {
    if (Math.abs(f - p[0]) < 0.03 && (!best || Math.abs(f - p[0]) < Math.abs(f - best[0]))) best = p;
  });
  return best ? { i: best[0] === 1 ? i + 1 : i, f: best[1] } : null;
}
function fmt(q) {
  var fr = fracao(q);
  if (fr) return ((fr.i ? fr.i : '') + fr.f) || '0';
  return String(Math.round(q * 10) / 10).replace('.', ',');
}
function bonito(q) { return !!fracao(q) || q >= 10; }
function nomeU(u, q) {
  var n = NOMES[u] || u || '';
  if (u === 'un') return '';
  if (q <= 1 || /^(ml|g|kg|a gosto)$/.test(n)) return n;
  if (/^colher/.test(n)) return n.replace(/^colher/, 'colheres');
  return n.replace(/^(\S+)/, '$1s');
}
function converter(q, u) {
  var m = estado.modo;
  if (m === 'original' || !ML[u]) return { q: q, u: u };
  var ml = q * ML[u];
  if (m !== 'auto') return { q: ml / ML[m], u: m };
  var ordem = ['xicara', 'colher_sopa', 'colher_cha'];
  for (var i = 0; i < ordem.length; i++) {
    var k = ordem[i];
    if (!ML[k]) continue;
    var v = ml / ML[k];
    if (v >= (k === 'xicara' ? 0.25 : 1) && bonito(v)) return { q: v, u: k };
  }
  return { q: q, u: u };
}

/* ---------- filtros ---------- */
function filtros() {
  var el = document.getElementById('filtros');
  if (!D) return;
  var usadas = {};
  D.receitas.forEach(function (r) { r.tags.forEach(function (t) { usadas[norm(t)] = t; }); });
  var tipoDe = {};
  D.tags.forEach(function (t) { tipoDe[norm(t.tag)] = t.tipo || 'Tags'; });
  var grupos = {};
  Object.keys(usadas).forEach(function (k) {
    var tp = tipoDe[k] || 'Tags';
    (grupos[tp] = grupos[tp] || []).push(usadas[k]);
  });
  var cats = {};
  D.receitas.forEach(function (r) { if (r.categoria) cats[r.categoria] = 1; });

  var h = '';
  var cl = Object.keys(cats).sort();
  if (cl.length > 1) h += linha('Categoria', cl.map(function (c) { return chip(c, 'cat', estado.cat === c); }));
  Object.keys(grupos).sort().forEach(function (tp) {
    h += linha(tp, grupos[tp].sort().map(function (t) { return chip(t, 'tag', estado.tags.indexOf(norm(t)) > -1); }));
  });
  el.innerHTML = h;
  el.style.display = (estado.aberta || estado.form) ? 'none' : '';
}
function linha(rot, chips) { return '<div class="linha"><span class="rot">' + esc(rot) + '</span>' + chips.join('') + '</div>'; }
function chip(t, tipo, on) { return '<button class="chip' + (on ? ' on' : '') + '" data-' + tipo + '="' + esc(t) + '">' + esc(t) + '</button>'; }

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-tag],[data-cat],[data-abrir],[data-voltar],[data-novo],[data-editar]');
  if (!b) return;
  if (b.hasAttribute('data-novo')) return abrirForm(null);
  if (b.hasAttribute('data-editar')) return abrirForm(receita(b.dataset.editar));
  if (estado.form) return;
  if (b.hasAttribute('data-tag')) {
    var k = norm(b.dataset.tag), i = estado.tags.indexOf(k);
    if (i > -1) estado.tags.splice(i, 1); else estado.tags.push(k);
  } else if (b.hasAttribute('data-cat')) {
    estado.cat = estado.cat === b.dataset.cat ? '' : b.dataset.cat;
  } else if (b.hasAttribute('data-abrir')) {
    estado.aberta = b.dataset.abrir; estado.fator = 1; window.scrollTo(0, 0);
  } else {
    estado.aberta = null;
  }
  filtros(); render();
});
document.getElementById('busca').addEventListener('input', function (e) {
  estado.busca = norm(e.target.value);
  estado.aberta = null;
  filtros(); render();
});

/* ---------- telas ---------- */
function render() {
  if (!D || estado.form) return;
  if (estado.aberta) {
    var r = D.receitas.filter(function (x) { return x.id === estado.aberta; })[0];
    if (r) return detalhe(r);
    estado.aberta = null;
  }
  var rs = D.receitas.filter(passa);
  var h = rs.length ? '<div class="grade">' + rs.map(card).join('') + '</div>'
                    : '<div class="vazio">Nenhuma receita encontrada.</div>';
  h += convBox();
  if (D.tagsDesconhecidas.length) {
    h += '<div class="aviso">Tags usadas nas receitas mas que não estão na aba Tags: ' + esc(D.tagsDesconhecidas.join(', ')) + '</div>';
  }
  app().innerHTML = h;
  bindConv();
}

function passa(r) {
  if (estado.cat && r.categoria !== estado.cat) return false;
  var rt = r.tags.map(norm);
  for (var i = 0; i < estado.tags.length; i++) if (rt.indexOf(estado.tags[i]) < 0) return false;
  if (!estado.busca) return true;
  var txt = [r.nome, r.categoria, r.tags.join(' ')];
  r.grupos.forEach(function (g) { g.itens.forEach(function (it) { txt.push(it.ingrediente); }); });
  var alvo = norm(txt.join(' '));
  return estado.busca.split(/\s+/).every(function (p) { return alvo.indexOf(p) > -1; });
}

function foto(u) {
  u = String(u || '').trim();
  if (!u) return '';
  var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800' : u;
}
function insta(u) {
  var m = String(u || '').match(/instagram\.com\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/);
  if (!m) return '';
  return 'https://www.instagram.com/' + (m[1] === 'reels' ? 'reel' : m[1]) + '/' + m[2] + '/embed/';
}
function tagsHtml(r) { return r.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(''); }

function card(r) {
  var f = foto(r.foto);
  var meta = [r.categoria, r.tempo ? r.tempo + ' min' : ''].filter(Boolean).join(' · ');
  return '<div class="card" data-abrir="' + esc(r.id) + '">' +
    '<div class="img"' + (f ? ' style="background-image:url(&quot;' + esc(f) + '&quot;)"' : '') + '>' + (f ? '' : '🍰') + '</div>' +
    '<div class="txt"><b>' + esc(r.nome || r.id) + '</b><div class="meta">' + esc(meta) + '</div>' + tagsHtml(r) + '</div></div>';
}

function item(it) {
  var q = qtdNum(it.qtd), qt = '';
  if (q == null) {
    qt = esc(it.qtd);
    var nu = nomeU(it.unidade, 1);
    if (nu) qt += (qt ? ' ' : '') + esc(nu);
  } else {
    var c = converter(q * estado.fator, it.unidade);
    var n = nomeU(c.u, c.q);
    qt = fmt(c.q) + (n ? ' ' + esc(n) : '');
  }
  var ing = esc(it.ingrediente);
  if (it.aGosto) {
    return '<li>' + ing + ' <span class="q">a gosto</span>' +
      (qt ? ' <span class="obs">(sugestão: ' + qt + ')</span>' : '') + obsHtml(it) + '</li>';
  }
  if (it.unidade === 'a_gosto' && q == null) return '<li>' + ing + ' <span class="q">a gosto</span>' + obsHtml(it) + '</li>';
  return '<li><span class="q">' + qt + '</span> ' + ing + obsHtml(it) + '</li>';
}
function obsHtml(it) { return it.obs ? ' <span class="obs">(' + esc(it.obs) + ')</span>' : ''; }

function opt(v, rot, sel) { return '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(rot) + '</option>'; }

function detalhe(r) {
  var meta = [r.categoria, r.rendimento, r.tempo ? r.tempo + ' min' : ''].filter(Boolean).join(' · ');
  var h = '<div class="cab-det"><button class="voltar" data-voltar>← Voltar</button>' +
    '<button class="btn sec" data-editar="' + esc(r.id) + '">✏️ Editar</button></div>' +
    '<h2>' + esc(r.nome || r.id) + '</h2><div class="meta">' + esc(meta) + '</div><div>' + tagsHtml(r) + '</div>';

  var modos = [['original', 'como na receita'], ['auto', 'mais prático']]
    .concat(['xicara', 'colher_sopa', 'colher_cha', 'ml'].filter(function (k) { return ML[k]; })
      .map(function (k) { return [k, 'tudo em ' + nomeU(k, 2)]; }));
  h += '<div class="barra">' +
    '<label>Medidas: <select id="modo">' + modos.map(function (m) { return opt(m[0], m[1], estado.modo === m[0]); }).join('') + '</select></label>' +
    '<label>Quantidade: <select id="fator">' + [0.5, 1, 1.5, 2, 3].map(function (f) { return opt(f, '× ' + fmt(f), estado.fator === f); }).join('') + '</select></label>' +
    '</div>';

  if (r.grupos.length) {
    h += '<div class="grupos">' + r.grupos.map(function (g) {
      return '<div class="grupo"><h4>' + esc(g.nome || 'Ingredientes') + '</h4><ul>' + g.itens.map(item).join('') + '</ul></div>';
    }).join('') + '</div>';
  }
  if (r.passos.length) {
    h += '<h3 class="sec">Modo de preparo</h3><div class="grupos">' + r.passos.map(function (g) {
      return '<div class="grupo">' + (g.nome ? '<h4>' + esc(g.nome) + '</h4>' : '') + '<ol>' +
        g.itens.map(function (p) { return '<li>' + esc(p.passo) + '</li>'; }).join('') + '</ol></div>';
    }).join('') + '</div>';
  }
  if (r.obs) h += '<p class="obs">' + esc(r.obs) + '</p>';

  var e = insta(r.insta);
  if (e) {
    h += '<div class="insta"><iframe src="' + esc(e) + '" loading="lazy" scrolling="no" allowtransparency="true"></iframe>' +
      '<div><a href="' + esc(r.insta) + '" target="_blank" rel="noopener">Abrir no Instagram ↗</a></div></div>';
  } else if (r.insta) {
    h += '<p><a href="' + esc(r.insta) + '" target="_blank" rel="noopener">Ver vídeo ↗</a></p>';
  }

  app().innerHTML = h;
  document.getElementById('modo').onchange = function () { estado.modo = this.value; render(); };
  document.getElementById('fator').onchange = function () { estado.fator = +this.value; render(); };
}

/* ---------- conversor avulso ---------- */
function convBox() {
  var ks = Object.keys(ML);
  if (!ks.length) return '';
  var ops = function (sel) { return ks.map(function (k) { return opt(k, NOMES[k], k === sel); }).join(''); };
  return '<div class="barra"><b>Conversor</b>' +
    '<input id="cq" value="1" size="4" inputmode="decimal">' +
    '<select id="cde">' + ops('xicara') + '</select> =' +
    '<span id="cres" class="q"></span>' +
    '<select id="cpara">' + ops('colher_sopa') + '</select></div>';
}
function bindConv() {
  var q = document.getElementById('cq');
  if (!q) return;
  var de = document.getElementById('cde'), para = document.getElementById('cpara'), res = document.getElementById('cres');
  function calc() {
    var n = qtdNum(q.value);
    res.textContent = n == null ? '?' : fmt(n * ML[de.value] / ML[para.value]);
  }
  q.oninput = de.onchange = para.onchange = calc;
  calc();
}

/* ---------- cadastro e edição ---------- */
function receita(id) { return D.receitas.filter(function (x) { return x.id === id; })[0]; }
function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function campo(rot, id, v, extra) {
  return '<div><label class="c">' + rot + '</label><input class="campo" id="' + id + '" value="' + esc(v || '') + '" ' + (extra || '') + '></div>';
}
function lista(id, valores) {
  return '<datalist id="' + id + '">' + valores.map(function (v) { return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>';
}

function abrirForm(r) {
  estado.form = { original: r ? r.id : '', idManual: !!r };
  filtros();
  window.scrollTo(0, 0);
  var cats = {};
  D.receitas.forEach(function (x) { if (x.categoria) cats[x.categoria] = 1; });
  app().innerHTML = '<div class="form"><h2>' + (r ? 'Editar receita' : 'Nova receita') + '</h2>' +
    '<label class="c">Nome *</label><input class="campo" id="f-nome" value="' + esc(r ? r.nome : '') + '">' +
    '<label class="c">Identificador (sem espaço; gerado a partir do nome)</label><input class="campo" id="f-id" value="' + esc(r ? r.id : '') + '">' +
    '<div class="duas">' +
      campo('Categoria', 'f-cat', r && r.categoria, 'list="l-cat"') +
      campo('Rendimento', 'f-rend', r && r.rendimento) +
      campo('Tempo (min)', 'f-tempo', r && r.tempo, 'inputmode="numeric"') +
      campo('Link do Instagram', 'f-insta', r && r.insta) +
      campo('Link da foto', 'f-foto', r && r.foto) +
    '</div>' +
    '<label class="c">Tags (separadas por vírgula)</label><input class="campo" id="f-tags" value="' + esc(r ? r.tags.join(', ') : '') + '">' +
    '<div class="sugs">' + D.tags.map(function (t) {
      return '<button type="button" class="chip" data-acao="tag" data-v="' + esc(t.tag) + '">+ ' + esc(t.tag) + '</button>';
    }).join('') + '</div>' +
    '<h3 class="sec">Ingredientes</h3><div id="f-grupos"></div>' +
    '<button type="button" class="btn sec" data-acao="add-grupo">+ Grupo de ingredientes</button>' +
    '<h3 class="sec">Modo de preparo</h3><div id="f-passos"></div>' +
    '<button type="button" class="btn sec" data-acao="add-pgrupo">+ Grupo de passos</button>' +
    '<label class="c">Observações</label><textarea id="f-obs">' + esc(r ? r.obs : '') + '</textarea>' +
    '<div class="acoes"><button type="button" class="btn" data-acao="salvar">Salvar</button>' +
    '<button type="button" class="btn sec" data-acao="cancelar">Cancelar</button><span id="f-msg" class="erro"></span></div>' +
    lista('l-cat', Object.keys(cats).sort()) + lista('l-ing', D.ingredientes || []) +
    '</div>';

  (r && r.grupos.length ? r.grupos : [{ nome: '', itens: [] }]).forEach(addGrupo);
  (r && r.passos.length ? r.passos : [{ nome: '', itens: [] }]).forEach(addPGrupo);

  var nome = document.getElementById('f-nome'), id = document.getElementById('f-id');
  nome.oninput = function () { if (!estado.form.idManual) id.value = slug(nome.value); };
  id.oninput = function () { estado.form.idManual = true; };
  nome.focus();
}

function caixaGrupo(dica, botao, acao) {
  return el('<div class="fgrupo"><div class="linha"><input class="gnome" placeholder="' + dica + '">' +
    '<button type="button" class="mini" data-acao="del-grupo" title="Remover grupo">🗑</button></div>' +
    '<div class="itens"></div><button type="button" class="btn sec" data-acao="' + acao + '">' + botao + '</button></div>');
}
function addGrupo(g) {
  var box = caixaGrupo('Nome do grupo, ex.: Secos (opcional)', '+ Ingrediente', 'add-ing');
  box.querySelector('.gnome').value = g.nome || '';
  document.getElementById('f-grupos').appendChild(box);
  (g.itens.length ? g.itens : [{}, {}, {}]).forEach(function (it) { addIng(box, it); });
}
function addIng(box, it) {
  var uops = '<option value="">unidade</option>' + D.unidades.map(function (u) { return opt(u.codigo, u.nome, false); }).join('');
  var row = el('<div class="fing"><input class="fq" placeholder="qtd" inputmode="decimal">' +
    '<select class="fu">' + uops + '</select>' +
    '<input class="fi" placeholder="ingrediente" list="l-ing"><input class="fo" placeholder="obs">' +
    '<label title="Marque para a quantidade virar só uma sugestão"><input type="checkbox" class="fg"> a gosto</label>' +
    '<button type="button" class="mini" data-acao="del" title="Remover">×</button></div>');
  row.querySelector('.fq').value = it.qtd == null ? '' : String(it.qtd).replace('.', ',');
  row.querySelector('.fu').value = it.unidade || '';
  row.querySelector('.fi').value = it.ingrediente || '';
  row.querySelector('.fo').value = it.obs || '';
  row.querySelector('.fg').checked = !!it.aGosto;
  box.querySelector('.itens').appendChild(row);
  return row;
}
function addPGrupo(g) {
  var box = caixaGrupo('Nome do grupo, ex.: Massa (opcional)', '+ Passo', 'add-passo');
  box.querySelector('.gnome').value = g.nome || '';
  document.getElementById('f-passos').appendChild(box);
  (g.itens.length ? g.itens : [{}]).forEach(function (p) { addPasso(box, p); });
}
function addPasso(box, p) {
  var row = el('<div class="fpasso"><textarea placeholder="Descreva o passo"></textarea>' +
    '<button type="button" class="mini" data-acao="del" title="Remover">×</button></div>');
  row.querySelector('textarea').value = p.passo || '';
  box.querySelector('.itens').appendChild(row);
  return row;
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-acao]');
  if (!b || !estado.form) return;
  var a = b.dataset.acao, box = b.closest('.fgrupo');
  if (a === 'add-grupo') addGrupo({ nome: '', itens: [] });
  else if (a === 'add-pgrupo') addPGrupo({ nome: '', itens: [] });
  else if (a === 'add-ing') addIng(box, {}).querySelector('.fq').focus();
  else if (a === 'add-passo') addPasso(box, {}).querySelector('textarea').focus();
  else if (a === 'del') b.parentNode.remove();
  else if (a === 'del-grupo') box.remove();
  else if (a === 'tag') {
    var t = document.getElementById('f-tags');
    var ts = t.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    if (ts.map(norm).indexOf(norm(b.dataset.v)) < 0) ts.push(b.dataset.v);
    t.value = ts.join(', ');
  }
  else if (a === 'cancelar') { estado.form = null; filtros(); render(); }
  else if (a === 'salvar') salvar(b);
});

function coletar() {
  function grupos(sel, mapear) {
    return [].map.call(document.querySelectorAll(sel + ' > .fgrupo'), function (box) {
      return { nome: box.querySelector('.gnome').value.trim(), itens: [].map.call(box.querySelectorAll('.itens > div'), mapear) };
    });
  }
  function v(id) { return document.getElementById(id).value.trim(); }
  return {
    idOriginal: estado.form.original,
    nome: v('f-nome'), id: slug(v('f-id') || v('f-nome')), categoria: v('f-cat'), rendimento: v('f-rend'),
    tempo: v('f-tempo'), insta: v('f-insta'), foto: v('f-foto'), obs: v('f-obs'),
    tags: v('f-tags').split(',').map(function (t) { return t.trim(); }).filter(Boolean),
    grupos: grupos('#f-grupos', function (row) {
      return {
        qtd: row.querySelector('.fq').value.trim(), unidade: row.querySelector('.fu').value,
        ingrediente: row.querySelector('.fi').value.trim(), obs: row.querySelector('.fo').value.trim(),
        aGosto: row.querySelector('.fg').checked,
      };
    }),
    passos: grupos('#f-passos', function (row) { return { passo: row.querySelector('textarea').value.trim() }; }),
  };
}

function salvar(btn) {
  var r = coletar(), msg = document.getElementById('f-msg');
  if (!r.nome) { msg.textContent = 'Dê um nome para a receita.'; return; }
  btn.disabled = true; btn.textContent = 'Salvando…'; msg.textContent = '';
  google.script.run
    .withSuccessHandler(function (res) {
      carregar(res.dados);
      estado.form = null; estado.aberta = res.id;
      filtros(); render(); window.scrollTo(0, 0);
    })
    .withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = 'Salvar';
      msg.textContent = (e && e.message) || 'Erro ao salvar.';
    })
    .salvarReceita(r);
}
</script>
</body>
