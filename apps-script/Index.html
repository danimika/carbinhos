<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,600;0,9..144,650;1,9..144,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Visual no mesmo estilo do Verticais: claro, Fraunces + Outfit, cards com faixa lateral. */
:root{color-scheme:light;--bg:#faf6f5;--raise:#fff;--card:#fff;--ink:#3d2c32;--muted:#8c6e74;--faint:#b79aa0;--ph:#cdb9bd;
  --line:rgba(61,44,50,.12);--accent:#c65d7b;--gold:#ab7a5a;--ok:#7e9b6e;--danger:#c97b72;--shadow:0 20px 48px rgba(61,44,50,.12);
  --serif:"Fraunces","Iowan Old Style",Palatino,serif;--sans:"Outfit","Avenir Next","Segoe UI",sans-serif}
*{box-sizing:border-box}
::placeholder{color:var(--ph);opacity:1}
html,body{margin:0;padding:0;overflow-x:clip}
body{min-height:100vh;background:radial-gradient(900px 420px at 0% -10%,rgba(198,93,123,.08),transparent 55%),radial-gradient(700px 380px at 100% 0%,rgba(171,122,90,.08),transparent 50%),var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--accent)}
.wrap{width:min(1120px,calc(100% - 32px));margin:0 auto}

/* topo */
.top{position:sticky;top:0;z-index:5;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);background:rgba(250,246,245,.86);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.brand{font-family:var(--serif);font-weight:650;font-size:1.85rem;letter-spacing:-.04em;line-height:1;cursor:pointer}
.acoes-topo{display:flex;gap:8px;margin-left:auto}
.busca{padding-bottom:12px}
#busca{width:100%;background:var(--raise) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' fill='none' stroke='%23b79aa0' stroke-width='2'><circle cx='8' cy='8' r='5.5'/><path d='M12 12l4 4' stroke-linecap='round'/></svg>") no-repeat 14px 50%;
  border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 42px;font-size:16px}
#busca::-webkit-search-cancel-button{display:none}
#filtros{display:flex;flex-direction:column;gap:8px;padding-bottom:14px}
#filtros:empty{display:none}
.linha{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rot{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);min-width:78px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.chip:hover{background:rgba(61,44,50,.05)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:20px 0 56px}

/* botões */
.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--raise);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff5f3;font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(61,44,50,.04)}
.btn.ghost.on{background:var(--accent);color:#fff5f3;border-color:transparent}
.btn.danger{background:transparent;color:var(--danger);padding-inline:8px}
.btn.tiny{padding:8px 13px;font-size:14px}
.btn:disabled{opacity:.55;cursor:progress}
.addlink{border:0;background:none;color:var(--accent);font-weight:500;padding:6px 2px;font-size:14px;align-self:flex-start}
.mini{border:0;background:none;color:var(--faint);font-size:20px;line-height:1;padding:0 6px}
.mini:hover{color:var(--danger)}
.icon-x{border:0;background:transparent;color:var(--muted);font-size:28px;line-height:1;padding:0 4px}

/* cards */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;box-shadow:inset 3px 0 0 var(--gold);transition:transform .18s ease,border-color .18s ease;overflow:hidden;min-width:0}
.card:hover{transform:translateY(-2px);border-color:rgba(61,44,50,.24)}
.card.fav{box-shadow:inset 3px 0 0 var(--accent)}
.foto{position:relative;overflow:hidden;background:rgba(61,44,50,.05) center/cover no-repeat}
.card .foto{margin:-16px -16px 6px;aspect-ratio:4/3}
/* embed do Instagram recortado: esconde o cabeçalho e mostra só a imagem do post */
.foto.ig iframe{position:absolute;left:50%;top:-58px;transform:translateX(-50%);width:max(100%,330px);height:900px;border:0;pointer-events:none;background:transparent}
.card h3{font-family:var(--serif);font-weight:560;font-size:1.32rem;letter-spacing:-.03em;line-height:1.15;padding-right:36px;overflow-wrap:anywhere}
.card .foto ~ h3{padding-right:0}
.meta{color:var(--faint);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:rgba(61,44,50,.05);color:var(--muted);border-radius:999px;padding:4px 9px;font-size:12px}
.estrela{position:absolute;top:12px;right:12px;z-index:2;width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--raise);
  color:var(--faint);font-size:17px;line-height:1;display:grid;place-items:center;padding:0}
.estrela:hover{color:var(--accent)}
.estrela.on{background:var(--accent);color:#fff5f3;border-color:transparent}
.vazio{color:var(--faint);padding:40px 0;text-align:center}
.aviso{font-size:12.5px;color:var(--faint);margin-top:22px}

/* receita aberta */
.det-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.voltar{border:0;background:none;color:var(--muted);padding:0;font-size:15px}
.voltar:hover{color:var(--ink)}
.det-acoes{display:flex;gap:8px}
.det h2{font-family:var(--serif);font-weight:600;font-size:2.15rem;letter-spacing:-.04em;line-height:1.08;margin-bottom:8px}
.det .tags{margin-top:10px}
.foto-grande{border-radius:18px;aspect-ratio:16/9;margin:18px 0 0;max-width:720px}
.barra{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;margin:22px 0 6px;font-size:14px;color:var(--muted)}
.barra select{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px;margin-left:6px;color:var(--ink)}
.dica{font-size:12.5px;color:var(--faint)}
.secao{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
.grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grupo{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.grupo h4{font-family:var(--serif);font-style:italic;font-weight:500;color:var(--gold);font-size:1.08rem;margin-bottom:6px}
.grupo ul,.grupo ol{margin:0;padding-left:20px}
.grupo li{margin:7px 0}
.grupo li::marker{color:var(--faint)}
.q,.qp{font-weight:600}
.obs{color:var(--faint);font-size:13.5px}
.notas{white-space:pre-line;color:var(--muted);font-size:14.5px;margin-top:20px;max-width:720px}
.qbtn{font:inherit;font-weight:600;color:inherit;background:none;border:0;border-bottom:1px dashed var(--gold);padding:0}
.qbtn.trocado{color:var(--gold)}
.insta{margin:24px 0 0;max-width:420px}
.insta iframe{width:100%;height:620px;border:1px solid var(--line);border-radius:18px;background:#fff}

/* janela (igual ao Verticais) */
dialog{border:0;padding:0;background:transparent;color:inherit;width:min(760px,calc(100vw - 24px));margin:auto}
dialog::backdrop{background:rgba(8,6,5,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{display:flex;flex-direction:column;background:var(--raise);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);max-height:min(90vh,960px);overflow:hidden}
.sheet:empty{display:none}
.sheet-head,.sheet-foot{display:flex;flex:none;justify-content:space-between;gap:12px;background:var(--raise)}
.sheet-head{align-items:flex-start;padding:20px 22px 10px}
.sheet-head h2{font-family:var(--serif);font-weight:560;font-size:1.7rem;letter-spacing:-.03em}
.eyebrow{font-family:var(--serif);font-style:italic;font-weight:500;font-size:.98rem;color:var(--gold)}
.sheet-body{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;padding:6px 22px 20px}
.sheet-foot{align-items:center;padding:12px 22px 18px;border-top:1px solid var(--line)}
.sheet-foot .dir{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* campos */
.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px;min-width:0}
.field>input,.field>textarea,.fing input,.conv-linha input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--ink)}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.nome>input{font-family:var(--serif);font-size:1.35rem;letter-spacing:-.03em}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.sub{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.hint{font-size:12.5px;color:var(--faint)}
.erro{color:var(--danger);font-size:14px}
.importar{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:rgba(61,44,50,.025)}
.importar summary{cursor:pointer;color:var(--muted);font-size:14px}
.importar textarea{width:100%;min-height:140px;margin:10px 0;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--raise)}
.fgrupo{border:1px solid var(--line);border-radius:16px;padding:8px 12px 10px;background:rgba(61,44,50,.02);display:flex;flex-direction:column}
.fgrupo+.fgrupo{margin-top:10px}
.fgrupo-top{display:flex;gap:6px;align-items:center}
.gnome{flex:1;min-width:0;border:0;background:transparent;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:var(--gold);padding:6px 2px}
.gnome:focus{outline:none;border-bottom:1px solid var(--gold)}
.fing{display:grid;grid-template-columns:78px 150px minmax(130px,1fr) minmax(90px,.7fr) auto auto;grid-template-areas:"q u i o g x";
  gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.fing input{padding:8px 10px;border-radius:12px;font-size:15px}
.fing .fq{grid-area:q}.fing .fu{grid-area:u}.fing .fi{grid-area:i}.fing .fo{grid-area:o}.fing .fg-l{grid-area:g}.fing .mini{grid-area:x}
.fing .fg-l{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:5px;align-items:center}
.fing.agosto .fq{border-style:dashed;border-color:var(--gold)}
.fpasso{display:flex;gap:6px;align-items:flex-start;padding:5px 0}
.fpasso textarea{flex:1;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:15px;background:var(--raise)}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sugs:empty{display:none}
.sugs .chip{font-size:12.5px;padding:4px 10px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* combobox: select em que dá pra digitar (mesmo jeito do Verticais) */
.combo{position:relative;min-width:0}
.cb-caixa{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:46px;padding:5px 56px 5px 12px;border:1px solid var(--line);border-radius:14px;background:var(--raise)}
.fing .cb-caixa,.conv-linha .cb-caixa{min-height:38px;border-radius:12px;padding:2px 50px 2px 8px}
.combo:focus-within .cb-caixa{border-color:var(--gold)}
.cb-in{flex:1 1 60px;min-width:50px;border:0!important;background:transparent!important;padding:4px 2px!important;font-size:15px;outline:none;color:var(--ink)}
.cb-chips{display:contents}
.cb-chip{display:inline-flex;align-items:center;gap:2px;background:rgba(61,44,50,.08);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;color:var(--ink)}
.cb-chip b{font-weight:400;color:var(--faint);cursor:pointer;padding:0 5px}
.cb-chip b:hover{color:var(--ink)}
.cb-x,.cb-seta{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:24px;height:24px;border:0;background:transparent;color:var(--faint);padding:0;cursor:pointer}
.cb-x{right:28px;font-size:18px}
.cb-seta{right:5px;font-size:11px}
.combo:not(.tem) .cb-x{visibility:hidden}
.cb-lista{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:min(340px,86vw);max-height:240px;overflow:auto;
  background:var(--raise);border:1px solid var(--line);border-radius:14px;z-index:30;box-shadow:var(--shadow);padding:4px}
.cb-op{padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.cb-op.on,.cb-op:hover{background:rgba(61,44,50,.06)}
.cb-vazio{padding:8px 10px;color:var(--faint);font-size:13px}

/* conversões */
.nova-conv{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(61,44,50,.02)}
.conv-linha{display:grid;grid-template-columns:72px minmax(120px,1fr) auto 72px minmax(120px,1fr);gap:6px;align-items:center}
.conv-linha input{padding:8px 10px;border-radius:12px;font-size:15px}
.igual{color:var(--muted);text-align:center}
.convs{list-style:none;padding:0;margin:0}
.convs li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.convs li:first-child{border-top:0}

/* visitante (só leitura): some tudo que altera; a estrela das favoritas fica só como marca */
.leitura [data-novo],.leitura [data-tela],.leitura [data-editar],.leitura .det-acoes [data-fav],.leitura .estrela:not(.on){display:none!important}
.leitura .estrela{pointer-events:none}

@media (max-width:640px){
  .brand{font-size:1.55rem}
  .bar{gap:8px}
  .acoes-topo .btn{padding:8px 11px}
  .rot{min-width:0;width:100%}
  .det h2{font-size:1.75rem}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0}
  .sheet{border-radius:22px 22px 0 0;max-height:94vh;max-height:94dvh}
  .sheet-head,.sheet-body,.sheet-foot{padding-left:16px;padding-right:16px}
  .fing{grid-template-columns:70px minmax(0,1fr) auto;grid-template-areas:"q u x" "i i i" "o o g";padding:10px 0}
  .conv-linha{grid-template-columns:64px minmax(0,1fr);grid-template-areas:"a b" "e e" "c d"}
  .conv-linha>:nth-child(1){grid-area:a}.conv-linha>:nth-child(2){grid-area:b}.conv-linha>:nth-child(3){grid-area:e}
  .conv-linha>:nth-child(4){grid-area:c}.conv-linha>:nth-child(5){grid-area:d}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar"><h1 class="brand" data-voltar>Carbinhos</h1><div class="acoes-topo">
    <button class="btn ghost tiny" data-tela="conv" title="Conversões de medidas">⚖️ Conversões</button>
    <button class="btn primary tiny" data-novo>+ Receita</button></div></div>
  <div class="busca"><input id="busca" type="search" placeholder="Buscar por nome, ingrediente ou tag" autocomplete="off"></div>
  <div id="filtros"></div>
</div></header>
<main class="wrap" id="app"><div class="vazio">Carregando receitas…</div></main>
<dialog id="dlg"><div class="sheet" id="dlg-sheet"></div></dialog>

<script>
var D = null;
var ML = {}, GR = {}, NOMES = {}, ABREV = {};
// tela: 'lista' ou 'conv'; alt: medida escolhida por ingrediente (clicando na quantidade)
var estado = { busca: '', tags: [], cat: '', fav: false, aberta: null, modo: 'original', fator: 1, form: null, tela: 'lista', alt: {} };
var FR = [[0, ''], [1/8, '⅛'], [1/4, '¼'], [1/3, '⅓'], [1/2, '½'], [2/3, '⅔'], [3/4, '¾'], [1, '']];

function app() { return document.getElementById('app'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

if (window.google && google.script) {
  google.script.run
    .withSuccessHandler(function (d) { carregar(d); filtros(); render(); })
    .withFailureHandler(function (e) {
      app().innerHTML = '<div class="vazio">Erro ao carregar: ' + esc(e && e.message) + '</div>';
    })
    .getData();
}

function carregar(d) {
  D = d; ML = {}; GR = {}; NOMES = {}; ABREV = {};
  document.body.classList.toggle('leitura', !d.podeEditar);
  d.conversoes = d.conversoes || [];
  d.unidades.forEach(function (u) {
    NOMES[u.codigo] = u.nome;
    if (u.ml) ML[u.codigo] = u.ml;
    if (u.gramas) GR[u.codigo] = u.gramas;
    if (u.abrev) ABREV[u.codigo] = u.abrev;
  });
}

/* ---------- quantidades e conversão ---------- */
function qtdNum(v) {
  if (typeof v === 'number') return v;
  var s = String(v || '').trim().replace(',', '.');
  if (!s) return null;
  var m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\/(\d+)$/);
  if (m) return m[1] / m[2];
  return isNaN(+s) ? null : +s;
}
function fracao(q) {
  var i = Math.floor(q + 1e-9), f = q - i, best = null;
  FR.forEach(function (p) {
    if (Math.abs(f - p[0]) < 0.03 && (!best || Math.abs(f - p[0]) < Math.abs(f - best[0]))) best = p;
  });
  return best ? { i: best[0] === 1 ? i + 1 : i, f: best[1] } : null;
}
function fmt(q) {
  var fr = fracao(q);
  if (fr) return ((fr.i ? fr.i : '') + fr.f) || '0';
  return String(Math.round(q * 10) / 10).replace('.', ',');
}
/** Quantidade para editar no formulário: 0.5 -> "1/2", 2.5 -> "2 1/2". */
function qtdTexto(v) {
  var q = qtdNum(v);
  if (q == null) return v == null ? '' : String(v);
  var fr = fracao(q);
  var asc = { '⅛': '1/8', '¼': '1/4', '⅓': '1/3', '½': '1/2', '⅔': '2/3', '¾': '3/4' };
  if (fr && fr.f) return (fr.i ? fr.i + ' ' : '') + asc[fr.f];
  return String(Math.round(q * 1000) / 1000).replace('.', ',');
}
function bonito(q) { return !!fracao(q) || q >= 10; }
function nomeU(u, q) {
  var n = NOMES[u] || u || '';
  if (u === 'un') return '';
  if (q <= 1 || /^(ml|g|kg)$/.test(n)) return n;
  if (/^colher/.test(n)) return n.replace(/^colher/, 'colheres');
  return n.replace(/^(\S+)/, '$1s');
}
/* Conversão entre volume (ml), peso (gramas) e contagem (unid., fatia...).
   Dentro do mesmo tipo é direto; entre tipos usa a aba Conversoes do ingrediente
   (ex.: manteiga 1 cs = 13 g), ou as conversões sem ingrediente, que valem para todos. */
function dimensao(u) {
  if (ML[u]) return ['vol', ML[u]];
  if (GR[u]) return ['peso', GR[u]];
  return ['u:' + u, 1];
}
/** A conversão de "ovo" vale para "ovos" e para "manteiga" vale "manteiga sem sal". */
function chaveIng(s) {
  return norm(s).split(/\s+/).map(function (w) { return w.length > 3 ? w.replace(/s$/, '') : w; }).join(' ');
}
function casaIng(convIng, ing) {
  var ci = chaveIng(convIng), k = chaveIng(ing);
  return !ci || ci === k || (' ' + k + ' ').indexOf(' ' + ci + ' ') > -1;
}
function conversoesDe(ing) {
  var l = [];
  D.conversoes.forEach(function (c) {
    if (!casaIng(c.ingrediente, ing)) return;
    var a = dimensao(c.unidade), b = dimensao(c.unidade_equiv);
    if (a[0] === b[0]) return;
    var r = (c.qtd_equiv * b[1]) / (c.qtd * a[1]);   // 1 base de a = r bases de b
    l.push([a[0], b[0], r], [b[0], a[0], 1 / r]);
  });
  return l;
}
function paraUnidade(q, u, alvo, ing) {
  if (u === alvo) return q;
  var a = dimensao(u), b = dimensao(alvo), base = q * a[1];
  if (a[0] === b[0]) return base / b[1];
  var arestas = conversoesDe(ing), visto = {}, fila = [[a[0], base]];
  visto[a[0]] = 1;
  while (fila.length) {
    var at = fila.shift();
    if (at[0] === b[0]) return at[1] / b[1];
    arestas.forEach(function (e) {
      if (e[0] === at[0] && !visto[e[1]]) { visto[e[1]] = 1; fila.push([e[1], at[1] * e[2]]); }
    });
  }
  return null;
}
/** Medidas em que este ingrediente pode aparecer (a original primeiro). */
function medidasPossiveis(it) {
  var q = qtdNum(it.qtd);
  if (q == null || !it.unidade) return [];
  var cands = [it.unidade, 'g', 'xicara', 'colher_sopa', 'colher_cha', 'ml', 'un'];
  // unidades das conversões específicas deste ingrediente (as genéricas não viram opção)
  D.conversoes.forEach(function (c) {
    if (c.ingrediente && casaIng(c.ingrediente, it.ingrediente)) cands.push(c.unidade, c.unidade_equiv);
  });
  var vistos = {};
  return cands.filter(function (u) {
    if (!u || vistos[u] || !NOMES[u]) return false;
    vistos[u] = 1;
    return paraUnidade(q, it.unidade, u, it.ingrediente) != null;
  });
}
function converter(q, u, ing) {
  var m = estado.modo;
  var alt = ing != null && estado.alt[norm(ing)];
  if (alt) {
    var r0 = paraUnidade(q, u, alt, ing);
    if (r0 != null) return { q: r0, u: alt };
  }
  if (m === 'original') return { q: q, u: u };
  if (m !== 'auto') {
    var r = paraUnidade(q, u, m, ing);
    return r == null ? { q: q, u: u } : { q: r, u: m };
  }
  if (!ML[u]) return { q: q, u: u };
  var ml = q * ML[u];
  var ordem = ['xicara', 'colher_sopa', 'colher_cha'];
  for (var i = 0; i < ordem.length; i++) {
    var k = ordem[i];
    if (!ML[k]) continue;
    var v = ml / ML[k];
    if (v >= (k === 'xicara' ? 0.25 : 1) && bonito(v)) return { q: v, u: k };
  }
  return { q: q, u: u };
}
/** Peso a partir de 10 g sai inteiro (153 g, não 152,8 g). */
function fmtU(q, u) { return GR[u] && q >= 10 ? String(Math.round(q)) : fmt(q); }

/* ---------- filtros ---------- */
function filtros() {
  var el = document.getElementById('filtros');
  if (!D) return;
  var usadas = {};
  D.receitas.forEach(function (r) { r.tags.forEach(function (t) { usadas[norm(t)] = t; }); });
  var tipoDe = {};
  D.tags.forEach(function (t) { tipoDe[norm(t.tag)] = t.tipo || 'Tags'; });
  var grupos = {};
  Object.keys(usadas).forEach(function (k) {
    var tp = tipoDe[k] || 'Tags';
    (grupos[tp] = grupos[tp] || []).push(usadas[k]);
  });
  var cats = {};
  D.receitas.forEach(function (r) { if (r.categoria) cats[r.categoria] = 1; });

  var h = '';
  // primeira linha: favoritas + categorias; depois as tags (agrupadas pelo "tipo" da aba Tags)
  var cl = Object.keys(cats).sort(), linha1 = [];
  if (D.receitas.some(function (r) { return r.favorita; })) {
    linha1.push('<button class="chip' + (estado.fav ? ' on' : '') + '" data-filtrofav>★ Favoritas</button>');
  }
  if (cl.length > 1) linha1 = linha1.concat(cl.map(function (c) { return chip(c, 'cat', estado.cat === c); }));
  if (linha1.length) h += '<div class="linha">' + linha1.join('') + '</div>';
  var tipos = Object.keys(grupos).sort();
  tipos.forEach(function (tp) {
    h += linha(tipos.length > 1 ? tp : '', grupos[tp].sort().map(function (t) { return chip(t, 'tag', estado.tags.indexOf(norm(t)) > -1); }));
  });
  el.innerHTML = estado.aberta ? '' : h;
}
function linha(rot, chips) { return '<div class="linha">' + (rot ? '<span class="rot">' + esc(rot) + '</span>' : '') + chips.join('') + '</div>'; }
function chip(t, tipo, on) { return '<button class="chip' + (on ? ' on' : '') + '" data-' + tipo + '="' + esc(t) + '">' + esc(t) + '</button>'; }

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-fav],[data-alt],[data-tela],[data-filtrofav],[data-tag],[data-cat],[data-abrir],[data-voltar],[data-novo],[data-editar]');
  if (!b || !D) return;
  if (estado.form) return;
  var altera = b.hasAttribute('data-novo') || b.hasAttribute('data-editar') || b.hasAttribute('data-tela') || b.hasAttribute('data-fav');
  if (altera && !D.podeEditar) return;
  if (b.hasAttribute('data-novo')) return abrirForm(null);
  if (b.hasAttribute('data-editar')) return abrirForm(receita(b.dataset.editar));
  if (b.hasAttribute('data-tela')) return abrirConversoes();
  if (b.hasAttribute('data-fav')) return favoritar(b.dataset.fav);
  if (b.hasAttribute('data-alt')) return trocarMedida(b.dataset.alt);
  if (b.hasAttribute('data-filtrofav')) {
    estado.fav = !estado.fav;
  } else if (b.hasAttribute('data-tag')) {
    var k = norm(b.dataset.tag), i = estado.tags.indexOf(k);
    if (i > -1) estado.tags.splice(i, 1); else estado.tags.push(k);
  } else if (b.hasAttribute('data-cat')) {
    estado.cat = estado.cat === b.dataset.cat ? '' : b.dataset.cat;
  } else if (b.hasAttribute('data-abrir')) {
    estado.aberta = b.dataset.abrir; estado.fator = 1; estado.alt = {}; window.scrollTo(0, 0);
  } else {
    estado.aberta = null;
  }
  filtros(); render();
});
document.getElementById('busca').addEventListener('input', function (e) {
  estado.busca = norm(e.target.value);
  estado.aberta = null;
  filtros(); render();
});

/* ---------- janela (formulário e conversões) ---------- */
var dlg = document.getElementById('dlg');
function abrirJanela(html, aoFechar) {
  document.getElementById('dlg-sheet').innerHTML = html;
  dlg._aoFechar = aoFechar || null;
  if (!dlg.open) dlg.showModal();
}
function fecharJanela() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', function () {
  var f = dlg._aoFechar;
  dlg._aoFechar = null;
  document.getElementById('dlg-sheet').innerHTML = '';

});
// Esc não fecha o formulário (para não perder o que foi digitado); use Cancelar ou ×
dlg.addEventListener('cancel', function (e) { if (estado.form) e.preventDefault(); });
dlg.addEventListener('click', function (e) { if (e.target.closest('[data-fechar]')) fecharJanela(); });

/** Botão de apagar em dois cliques: o primeiro pede confirmação. */
function confirmou(btn, texto) {
  if (btn.dataset.confirma) return true;
  var orig = btn.textContent;
  btn.dataset.confirma = '1'; btn.textContent = texto;
  setTimeout(function () { if (document.body.contains(btn)) { delete btn.dataset.confirma; btn.textContent = orig; } }, 4000);
  return false;
}

/* ---------- favoritas ---------- */
function favoritar(id) {
  var r = receita(id);
  if (!r) return;
  r.favorita = !r.favorita;   // muda na hora; desfaz se a planilha der erro
  filtros(); render();
  google.script.run
    .withFailureHandler(function (e) {
      r.favorita = !r.favorita; filtros(); render();
      alert('Não consegui salvar a favorita: ' + ((e && e.message) || 'erro'));
    })
    .marcarFavorita(id, r.favorita);
}

/* ---------- clicar na quantidade troca a medida daquele ingrediente ---------- */
function trocarMedida(chave) {
  var r = receita(estado.aberta), it = null;
  if (!r) return;
  ingredientesDe(r).forEach(function (x) { if (norm(x.ingrediente) === chave) it = x; });
  if (!it) return;
  var ms = medidasPossiveis(it);
  var atual = converter(qtdNum(it.qtd) * estado.fator, it.unidade, it.ingrediente).u;
  var prox = ms[(ms.indexOf(atual) + 1) % ms.length];
  if (prox === it.unidade && estado.modo === 'original') delete estado.alt[chave];
  else estado.alt[chave] = prox;
  render();
}

/* ---------- telas ---------- */
function render() {
  if (!D) return;
  if (estado.aberta) {
    var r = receita(estado.aberta);
    if (r) return detalhe(r);
    estado.aberta = null;
  }
  // favoritas primeiro, o resto na ordem da planilha
  var rs = D.receitas.filter(passa).map(function (r, i) { return [r, i]; })
    .sort(function (a, b) { return (b[0].favorita - a[0].favorita) || (a[1] - b[1]); })
    .map(function (x) { return x[0]; });
  var h = rs.length ? '<div class="grade">' + rs.map(card).join('') + '</div>'
                    : '<div class="vazio">Nenhuma receita encontrada.</div>';
  if (D.tagsDesconhecidas.length) {
    h += '<div class="aviso">Tags usadas nas receitas mas que não estão na aba Tags: ' + esc(D.tagsDesconhecidas.join(', ')) + '</div>';
  }
  app().innerHTML = h;
}

function passa(r) {
  if (estado.fav && !r.favorita) return false;
  if (estado.cat && r.categoria !== estado.cat) return false;
  var rt = r.tags.map(norm);
  for (var i = 0; i < estado.tags.length; i++) if (rt.indexOf(estado.tags[i]) < 0) return false;
  if (!estado.busca) return true;
  var txt = [r.nome, r.categoria, r.tags.join(' ')];
  r.grupos.forEach(function (g) { g.itens.forEach(function (it) { txt.push(it.ingrediente); }); });
  var alvo = norm(txt.join(' '));
  return estado.busca.split(/\s+/).every(function (p) { return alvo.indexOf(p) > -1; });
}

function foto(u) {
  u = String(u || '').trim();
  if (!u) return '';
  var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w800' : u;
}
function insta(u) {
  var m = String(u || '').match(/instagram\.com\/(?:[\w.]+\/)?(p|reel|reels|tv)\/([\w-]+)/);
  if (!m) return '';
  return 'https://www.instagram.com/' + (m[1] === 'reels' ? 'reel' : m[1]) + '/' + m[2] + '/embed/';
}
function tagsHtml(r) { return r.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(''); }

/** Foto do card: o "Link da foto" se tiver; senão a imagem do post do Instagram (embed recortado). */
function fotoHtml(r, classe) {
  var f = foto(r.foto);
  if (f) return '<div class="foto ' + classe + '" style="background-image:url(&quot;' + esc(f) + '&quot;)"></div>';
  var e = insta(r.insta);
  if (e) return '<div class="foto ig ' + classe + '"><iframe src="' + esc(e) + '" loading="lazy" scrolling="no" tabindex="-1" aria-hidden="true"></iframe></div>';
  return '';
}

function card(r) {
  var meta = [r.categoria, r.tempo ? r.tempo + ' min' : ''].filter(Boolean).join(' · ');
  return '<div class="card' + (r.favorita ? ' fav' : '') + '" data-abrir="' + esc(r.id) + '">' +
    fotoHtml(r, '') +
    '<button class="estrela' + (r.favorita ? ' on' : '') + '" data-fav="' + esc(r.id) + '" title="' +
      (r.favorita ? 'Tirar das favoritas' : 'Favoritar') + '">' + (r.favorita ? '★' : '☆') + '</button>' +
    '<h3>' + esc(r.nome || r.id) + '</h3>' +
    (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
    (r.tags.length ? '<div class="tags">' + tagsHtml(r) + '</div>' : '') + '</div>';
}

function item(it) {
  var q = qtdNum(it.qtd), qt = '';
  if (q == null) {
    qt = esc(it.qtd);
    var nu = nomeU(it.unidade, 1);
    if (nu) qt += (qt ? ' ' : '') + esc(nu);
  } else {
    var c = converter(q * estado.fator, it.unidade, it.ingrediente);
    var n = c.u === 'un' && c.u !== it.unidade ? 'unid.' : nomeU(c.u, c.q);
    qt = fmtU(c.q, c.u) + (n ? ' ' + esc(n) : '');
    // quando dá para ver em outra medida, a quantidade vira um botão que troca
    if (medidasPossiveis(it).length > 1) {
      qt = '<button class="qbtn' + (c.u !== it.unidade ? ' trocado' : '') + '" data-alt="' + esc(norm(it.ingrediente)) +
        '" title="Clique para ver em outra medida">' + qt + '</button>';
    }
  }
  var ing = esc(it.ingrediente);
  if (it.aGosto || it.unidade === 'a_gosto') {
    return '<li>' + ing + ' <span class="q">a gosto</span>' +
      (q != null ? ' <span class="obs">(sugestão: ' + qt + ')</span>' : '') + obsHtml(it) + '</li>';
  }
  return '<li><span class="q">' + qt + '</span> ' + ing + obsHtml(it) + '</li>';
}
function obsHtml(it) { return it.obs ? ' <span class="obs">(' + esc(it.obs) + ')</span>' : ''; }

/* {ingrediente} no modo de preparo vira a quantidade resumida: (400 g), (s. ½ cc) */
function ingredientesDe(r) {
  var l = [];
  r.grupos.forEach(function (g) { g.itens.forEach(function (it) { l.push(it); }); });
  return l;
}
function acharIng(lista, chave) {
  var k = norm(chave);
  if (!k) return null;
  function por(f) { return lista.filter(function (it) { return f(norm(it.ingrediente)); })[0]; }
  return por(function (n) { return n === k; }) ||
    por(function (n) { return (' ' + n + ' ').indexOf(' ' + k + ' ') > -1; }) ||
    por(function (n) { return n.indexOf(k) > -1; }) ||
    por(function (n) { return n && k.indexOf(n) > -1; });
}
function abrevU(u, q) {
  if (u === 'un') return 'unid.';
  if (ABREV[u] && ABREV[u] !== NOMES[u]) return ABREV[u];
  return nomeU(u, q);
}
function qtdCurta(it) {
  var q = qtdNum(it.qtd), t = '';
  if (q != null) {
    var c = converter(q * estado.fator, it.unidade, it.ingrediente), a = abrevU(c.u, c.q);
    t = fmtU(c.q, c.u) + (a ? ' ' + a : '');
  } else if (it.qtd) {
    t = String(it.qtd);
  }
  if (it.aGosto) return t ? 's. ' + t : 'a gosto';
  return t;
}
function passoHtml(texto, ings) {
  var out = '', ultimo = 0, re = /\{([^{}]+)\}/g, m;
  while ((m = re.exec(texto))) {
    out += esc(texto.slice(ultimo, m.index));
    var partes = m[1].split(','), chave = partes.shift().trim(), extra = partes.join(',').trim();
    var it = acharIng(ings, chave), q = it ? qtdCurta(it) : chave;
    var dentro = [q, extra].filter(Boolean).join(', ');
    if (dentro) out += '<span class="qp">(' + esc(dentro) + ')</span>';
    ultimo = re.lastIndex;
  }
  return out + esc(texto.slice(ultimo));
}

function opt(v, rot, sel) { return '<option value="' + esc(v) + '"' + (sel ? ' selected' : '') + '>' + esc(rot) + '</option>'; }

function detalhe(r) {
  var meta = [r.categoria, r.rendimento, r.tempo ? r.tempo + ' min' : ''].filter(Boolean).join(' · ');
  var h = '<div class="det"><div class="det-top"><button class="voltar" data-voltar>← Receitas</button><div class="det-acoes">' +
    '<button class="btn ghost tiny' + (r.favorita ? ' on' : '') + '" data-fav="' + esc(r.id) + '">' +
      (r.favorita ? '★ Favorita' : '☆ Favoritar') + '</button>' +
    '<button class="btn ghost tiny" data-editar="' + esc(r.id) + '">Editar</button></div></div>' +
    '<h2>' + esc(r.nome || r.id) + '</h2>' +
    (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
    (r.tags.length ? '<div class="tags">' + tagsHtml(r) + '</div>' : '');
  var f = foto(r.foto);
  if (f) h += '<div class="foto foto-grande" style="background-image:url(&quot;' + esc(f) + '&quot;)"></div>';

  var modos = [['original', 'como na receita'], ['auto', 'mais prático']]
    .concat(['xicara', 'colher_sopa', 'colher_cha', 'ml'].filter(function (k) { return ML[k]; })
      .map(function (k) { return [k, 'tudo em ' + nomeU(k, 2)]; }))
    .concat(GR.g ? [['g', 'tudo em gramas (peso)']] : []);
  h += '<div class="barra">' +
    '<label>Medidas<select id="modo">' + modos.map(function (m) { return opt(m[0], m[1], estado.modo === m[0]); }).join('') + '</select></label>' +
    '<label>Porção<select id="fator">' + [0.5, 1, 1.5, 2, 3].map(function (x) { return opt(x, '× ' + fmt(x), estado.fator === x); }).join('') + '</select></label>' +
    '</div>' +
    '<p class="dica">Toque numa quantidade sublinhada para ver em outra medida.</p>';

  if (r.grupos.length) {
    h += '<h3 class="secao">Ingredientes</h3><div class="grupos">' + r.grupos.map(function (g) {
      return '<div class="grupo">' + (g.nome ? '<h4>' + esc(g.nome) + '</h4>' : '') + '<ul>' + g.itens.map(item).join('') + '</ul></div>';
    }).join('') + '</div>';
  }
  if (r.passos.length) {
    var ings = ingredientesDe(r);
    h += '<h3 class="secao">Modo de preparo</h3><div class="grupos">' + r.passos.map(function (g) {
      return '<div class="grupo">' + (g.nome ? '<h4>' + esc(g.nome) + '</h4>' : '') + '<ol>' +
        g.itens.map(function (p) { return '<li>' + passoHtml(p.passo, ings) + '</li>'; }).join('') + '</ol></div>';
    }).join('') + '</div>';
  }
  if (r.obs) h += '<p class="notas">' + esc(r.obs) + '</p>';

  var e = insta(r.insta);
  if (e) {
    h += '<h3 class="secao">No Instagram</h3><div class="insta"><iframe src="' + esc(e) + '" loading="lazy" scrolling="no" allowtransparency="true"></iframe>' +
      '<p class="hint"><a href="' + esc(r.insta) + '" target="_blank" rel="noopener">Abrir no Instagram ↗</a></p></div>';
  } else if (r.insta) {
    h += '<p class="hint" style="margin-top:20px"><a href="' + esc(r.insta) + '" target="_blank" rel="noopener">Ver vídeo ↗</a></p>';
  }

  app().innerHTML = h + '</div>';
  document.getElementById('modo').onchange = function () { estado.modo = this.value; estado.alt = {}; render(); };
  document.getElementById('fator').onchange = function () { estado.fator = +this.value; render(); };
}

/* ---------- conversões (janela) ---------- */
function textoConv(c) {
  function nome(u, q) { return u === 'un' ? (q > 1 ? 'unidades' : 'unidade') : nomeU(u, q); }
  return fmtU(c.qtd, c.unidade) + ' ' + nome(c.unidade, c.qtd) + ' = ' + fmtU(c.qtd_equiv, c.unidade_equiv) + ' ' + nome(c.unidade_equiv, c.qtd_equiv);
}
/** Ex.: com 1 cs = 13 g, mostra "1 xícara ≈ 208 g" para ajudar a conferir. */
function exemploConv(c) {
  var a = dimensao(c.unidade)[0], b = dimensao(c.unidade_equiv)[0];
  if ((a === 'vol' && b === 'peso') || (a === 'peso' && b === 'vol')) {
    var g = paraUnidade(1, 'xicara', 'g', c.ingrediente || '');
    if (g != null && ML.xicara) return '1 xícara ≈ ' + fmtU(g, 'g') + ' g';
  }
  return null;
}
function abrirConversoes() {
  var cs = D.conversoes.slice().sort(function (a, b) { return norm(a.ingrediente).localeCompare(norm(b.ingrediente)); });
  var lista = cs.length ? '<ul class="convs">' + cs.map(function (c) {
    var ex = exemploConv(c);
    return '<li><span><b>' + esc(c.ingrediente || 'qualquer ingrediente') + '</b> · ' + esc(textoConv(c)) +
      (ex ? ' <span class="obs">(' + esc(ex) + ')</span>' : '') + '</span>' +
      '<button type="button" class="btn danger tiny" data-apagarconv="' + D.conversoes.indexOf(c) + '">Apagar</button></li>';
  }).join('') + '</ul>' : '<p class="vazio">Nenhuma conversão ainda.</p>';
  abrirJanela(
    '<div class="sheet-head"><div><p class="eyebrow">Medidas</p><h2>Conversões</h2></div>' +
      '<button type="button" class="icon-x" data-fechar aria-label="Fechar">×</button></div>' +
    '<div class="sheet-body">' +
      '<p class="hint">Quanto uma medida vale em outra, por ingrediente (ex.: manteiga, 1 colher de sopa = 13 g). ' +
      'Com isso, na receita dá para ver o ingrediente em peso, volume ou unidades. Sem ingrediente, vale para todos.</p>' +
      '<div class="nova-conv"><div class="field">Ingrediente<div id="c-ing"></div></div>' +
        '<div class="conv-linha"><input id="c-q1" placeholder="qtd" inputmode="decimal" value="1"><div id="c-u1"></div>' +
        '<span class="igual">=</span><input id="c-q2" placeholder="qtd" inputmode="decimal"><div id="c-u2"></div></div>' +
        '<div class="linha"><button type="button" class="btn primary tiny" id="c-add">Adicionar</button><span id="c-msg" class="erro"></span></div></div>' +
      lista +
    '</div>' +
    '<div class="sheet-foot"><div class="dir"><button type="button" class="btn ghost" data-fechar>Fechar</button></div></div>');

  var uops = opcoesUnidade();
  new Combo(document.getElementById('c-ing'), { opcoes: opcoes(D.ingredientes || []), valor: '', criar: true, dica: 'vazio = vale para todos' });
  new Combo(document.getElementById('c-u1'), { opcoes: uops, valor: 'colher_sopa', criar: true, dica: 'unidade' });
  new Combo(document.getElementById('c-u2'), { opcoes: uops, valor: 'g', criar: true, dica: 'unidade' });
  function atualizar(d) { carregar(d); render(); abrirConversoes(); }
  document.getElementById('c-add').onclick = function () {
    var btn = this, msg = document.getElementById('c-msg');
    var c = {
      ingrediente: combo('c-ing').get(), qtd: document.getElementById('c-q1').value.trim(), unidade: combo('c-u1').get(),
      qtd_equiv: document.getElementById('c-q2').value.trim(), unidade_equiv: combo('c-u2').get(),
    };
    if (!c.qtd || !c.qtd_equiv) { msg.textContent = 'Preencha as duas quantidades.'; return; }
    btn.disabled = true; btn.textContent = 'Salvando…'; msg.textContent = '';
    google.script.run.withSuccessHandler(atualizar)
      .withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Adicionar'; msg.textContent = (e && e.message) || 'Erro ao salvar.'; })
      .salvarConversao(c);
  };
  [].forEach.call(document.querySelectorAll('[data-apagarconv]'), function (b) {
    b.onclick = function () {
      if (!confirmou(b, 'Apagar mesmo?')) return;

        .apagarConversao(D.conversoes[+b.dataset.apagarconv]);

}

/* ---------- combobox: select em que dá pra digitar ----------
   cfg: { opcoes: [{v, t}], multi, valor (texto ou lista), criar (aceita valor novo), dica } */
function Combo(host, cfg) {
  var self = this;
  this.cfg = cfg; this.multi = !!cfg.multi; this.vals = []; this.ativo = -1; this.itens = [];
  host.classList.add('combo');
  host.innerHTML = '<div class="cb-caixa"><span class="cb-chips"></span><input class="cb-in" autocomplete="off">' +
    '<button type="button" class="cb-x" tabindex="-1" title="Limpar">×</button><span class="cb-seta">▾</span></div>' +
    '<div class="cb-lista" hidden></div>';
  this.host = host;
  this.inp = host.querySelector('.cb-in');
  this.lista = host.querySelector('.cb-lista');
  this.chips = host.querySelector('.cb-chips');
  this.inp.placeholder = cfg.dica || '';
  host._combo = this;
  this.set(cfg.valor);
  this.inp.addEventListener('focus', function () { self.abrir(); });
  this.inp.addEventListener('input', function () { self.ativo = 0; self.abrir(); self.pintar(); });
  this.inp.addEventListener('keydown', function (e) { self.tecla(e); });
  this.inp.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== self.inp) self.fechar(true); }, 120); });
  host.querySelector('.cb-x').addEventListener('mousedown', function (e) { e.preventDefault(); self.set(self.multi ? [] : ''); self.inp.focus(); });
  host.querySelector('.cb-seta').addEventListener('mousedown', function (e) {
    e.preventDefault();
    if (document.activeElement === self.inp && !self.lista.hidden) self.lista.hidden = true; else { self.inp.focus(); self.abrir(); }
  });
  this.lista.addEventListener('mousedown', function (e) {
    e.preventDefault();
    var li = e.target.closest('[data-i]');
    if (li) self.escolher(self.itens[+li.dataset.i]);
  });
  this.chips.addEventListener('mousedown', function (e) {
    var x = e.target.closest('[data-rm]');
    if (x) { e.preventDefault(); self.vals.splice(+x.dataset.rm, 1); self.pintar(); }
  });
}
Combo.prototype.rotulo = function (v) {
  var o = this.cfg.opcoes.filter(function (o) { return o.v === v; })[0];
  return o ? o.t : v;
};
Combo.prototype.set = function (v) {
  if (this.multi) { this.vals = (v || []).slice(); this.inp.value = ''; }
  else { this.vals = v ? [v] : []; this.inp.value = v ? this.rotulo(v) : ''; }
  this.pintar();
};
Combo.prototype.get = function () {
  if (this.multi) return this.vals.slice();
  var t = this.inp.value.trim();
  if (!t) return '';
  if (this.vals[0] && this.rotulo(this.vals[0]) === t) return this.vals[0];
  var o = this.cfg.opcoes.filter(function (o) { return norm(o.t) === norm(t) || norm(o.v) === norm(t); })[0];
  return o ? o.v : (this.cfg.criar ? t : '');
};
Combo.prototype.pintar = function () {
  var self = this;
  if (this.multi) {
    this.chips.innerHTML = this.vals.map(function (v, i) {
      return '<span class="cb-chip">' + esc(self.rotulo(v)) + '<b data-rm="' + i + '" title="Tirar">×</b></span>';
    }).join('');
  }
  this.host.classList.toggle('tem', this.multi ? this.vals.length > 0 : !!this.inp.value);
};
Combo.prototype.abrir = function () {
  var self = this, cru = this.inp.value.trim(), t = norm(cru);
  var ja = this.multi ? this.vals.map(norm) : [];
  // com um valor já escolhido, ao focar mostra todas as opções
  if (!this.multi && this.vals[0] && cru === this.rotulo(this.vals[0])) t = '';
  var ops = this.cfg.opcoes.filter(function (o) { return ja.indexOf(norm(o.v)) < 0 && (!t || norm(o.t).indexOf(t) > -1); });
  ops.sort(function (a, b) {
    var pa = norm(a.t) === t ? 0 : norm(a.t).indexOf(t) === 0 ? 1 : 2;
    var pb = norm(b.t) === t ? 0 : norm(b.t).indexOf(t) === 0 ? 1 : 2;
    return pa - pb;
  });
  this.itens = ops.slice(0, 60);
  var existe = this.cfg.opcoes.some(function (o) { return norm(o.t) === t; }) || ja.indexOf(t) > -1;
  if (this.cfg.criar && t && !existe) {
    var novo = { v: cru, t: cru, novo: true };
    var comeca = this.itens.some(function (o) { return norm(o.t).indexOf(t) === 0; });
    if (comeca) this.itens.push(novo); else this.itens.unshift(novo);
  }
  if (this.ativo >= this.itens.length) this.ativo = this.itens.length - 1;
  this.lista.innerHTML = this.itens.map(function (o, i) {
    return '<div class="cb-op' + (i === self.ativo ? ' on' : '') + '" data-i="' + i + '">' +
      (o.novo ? '+ Criar “' + esc(o.t) + '”' : esc(o.t)) + '</div>';
  }).join('') || '<div class="cb-vazio">Nada encontrado</div>';
  this.lista.hidden = false;
  var on = this.lista.querySelector('.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
};
Combo.prototype.fechar = function (saindo) {
  this.lista.hidden = true; this.ativo = -1;
  if (!saindo) return;
  var cru = this.inp.value.trim();
  if (this.multi) {
    if (cru && this.cfg.criar) this.escolher({ v: cru, t: cru }, true);
  } else {
    var v = this.get();
    this.vals = v ? [v] : [];
    this.inp.value = v ? this.rotulo(v) : '';
    this.pintar();
  }
};
Combo.prototype.escolher = function (o, semAbrir) {
  if (!o) return;
  if (this.multi) {
    if (this.vals.map(norm).indexOf(norm(o.v)) < 0) this.vals.push(o.v);
    this.inp.value = ''; this.pintar();
    if (!semAbrir) { this.ativo = -1; this.abrir(); }
  } else {
    this.vals = [o.v]; this.inp.value = o.t; this.pintar();
    this.lista.hidden = true;
  }
};
Combo.prototype.tecla = function (e) {
  var n = this.itens.length, cru = this.inp.value.trim();
  if (e.key === 'ArrowDown') { e.preventDefault(); this.ativo = Math.min(n - 1, this.ativo + 1); this.abrir(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); this.ativo = Math.max(0, this.ativo - 1); this.abrir(); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (!this.lista.hidden && this.itens[this.ativo]) this.escolher(this.itens[this.ativo]);
    else if (this.multi && cru && this.cfg.criar) this.escolher({ v: cru, t: cru });
    else this.lista.hidden = true;
  }
  else if (e.key === 'Escape') { if (!this.lista.hidden) { e.preventDefault(); e.stopPropagation(); } this.lista.hidden = true; }
  else if (e.key === 'Tab' && !this.lista.hidden && this.ativo >= 0 && this.itens[this.ativo] && cru) {
    this.escolher(this.itens[this.ativo], true);
  }
  else if (e.key === 'Backspace' && this.multi && !cru && this.vals.length) { this.vals.pop(); this.pintar(); this.abrir(); }
  else if (e.key === ',' && this.multi) { e.preventDefault(); if (cru) this.escolher({ v: cru, t: cru }); }
};
function opcoes(lista) { return lista.map(function (x) { return { v: x, t: x }; }); }
function opcoesUnidade() {
  return D.unidades.filter(function (u) { return u.codigo !== 'a_gosto'; })
    .map(function (u) { return { v: u.codigo, t: u.nome }; });
}

function slug(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }

function caixaGrupo(dica, botao, acao) {

    '<button type="button" class="mini" data-acao="del-grupo" title="Remover grupo">×</button></div>' +

function addGrupo(g) {
  var box = caixaGrupo('Nome do grupo, ex.: Secos (opcional)', '+ Ingrediente', 'add-ing');
  box.querySelector('.gnome').value = g.nome || '';
  document.getElementById('f-grupos').appendChild(box);

function addIng(box, it) {
  var row = el('<div class="fing"><input class="fq" placeholder="qtd" inputmode="decimal"><div class="fu"></div><div class="fi"></div>' +
    '<input class="fo" placeholder="obs">' +
    '<label class="fg-l" title="Marque se for a gosto. A quantidade vira só uma sugestão."><input type="checkbox" class="fg"> a gosto</label>' +

    row.classList.toggle('agosto', fg.checked);

  document.getElementById('f-passos').appendChild(box);

}

    '<button type="button" class="mini" data-acao="del" title="Remover">×</button></div>');

function nomesNoForm() {

}

document.addEventListener('focusin', function (e) {

    estado.form.ultimoPasso = e.target;
    chipsIng();
  }
});

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-acao]');
  if (!b || !estado.form) return;
  var a = b.dataset.acao, box = b.closest('.fgrupo');
  if (a === 'add-grupo') addGrupo({ nome: '', itens: [] });
  else if (a === 'add-pgrupo') addPGrupo({ nome: '', itens: [] });
  else if (a === 'add-ing') addIng(box, {}).querySelector('.fq').focus();
  else if (a === 'add-passo') addPasso(box, {}).querySelector('textarea').focus();
  else if (a === 'del') b.parentNode.remove();
  else if (a === 'del-grupo') box.remove();
  else if (a === 'ins') inserirNoPasso('{' + b.dataset.v + '}');
  else if (a === 'importar') importar();
  else if (a === 'cancelar') fecharJanela();
  else if (a === 'salvar') salvar(b);
  else if (a === 'excluir') excluir(b);
});

function excluir(btn) {
  var id = estado.form.original, msg = document.getElementById('f-msg');
  if (!confirmou(btn, 'Clique de novo para excluir')) return;
  btn.disabled = true; btn.textContent = 'Excluindo…'; msg.textContent = '';
  google.script.run
    .withSuccessHandler(function (d) {
      carregar(d); estado.aberta = null;
      fecharJanela(); filtros(); render(); window.scrollTo(0, 0);
    })
    .withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = 'Excluir';
      msg.textContent = (e && e.message) || 'Erro ao excluir.';
    })

}

function inserirNoPasso(txt) {
  var ta = estado.form.ultimoPasso;
  if (!ta || !document.body.contains(ta)) return;
  var i = ta.selectionStart, f = ta.selectionEnd, antes = ta.value.slice(0, i);
  if (antes && !/\s$/.test(antes)) txt = ' ' + txt;
  ta.value = antes + txt + ta.value.slice(f);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = i + txt.length;
}

function importar() {
  var txt = document.getElementById('f-texto').value, msg = document.getElementById('f-imsg');
  if (!txt.trim()) { msg.textContent = 'Cole o texto da receita primeiro.'; return; }
  var p = parseReceita(txt, D.unidades);
  if (p.nome) {
    document.getElementById('f-nome').value = p.nome;
    if (!estado.form.idManual) document.getElementById('f-id').value = slug(p.nome);
  }
  if (p.rendimento) document.getElementById('f-rend').value = p.rendimento;
  if (p.obs) document.getElementById('f-obs').value = p.obs;
  if (p.grupos.length) { document.getElementById('f-grupos').innerHTML = ''; p.grupos.forEach(addGrupo); }
  if (p.passos.length) { document.getElementById('f-passos').innerHTML = ''; p.passos.forEach(addPGrupo); }
  chipsIng();
  var n = 0; p.grupos.forEach(function (g) { n += g.itens.length; });
  var np = 0; p.passos.forEach(function (g) { np += g.itens.length; });
  msg.textContent = 'Pronto: ' + n + ' ingredientes e ' + np + ' passos. Confira antes de salvar.';
  document.querySelector('.importar').open = false;
}

function coletar() {
  function grupos(sel, mapear) {
    return [].map.call(document.querySelectorAll(sel + ' > .fgrupo'), function (box) {
      return { nome: box.querySelector('.gnome').value.trim(), itens: [].map.call(box.querySelectorAll('.itens > div'), mapear) };
    });
  }
  function v(id) { return document.getElementById(id).value.trim(); }
  return {
    idOriginal: estado.form.original,
    nome: v('f-nome'), id: slug(v('f-id') || v('f-nome')), categoria: combo('f-cat').get(), rendimento: v('f-rend'),
    tempo: v('f-tempo'), insta: v('f-insta'), foto: v('f-foto'), obs: v('f-obs'),
    tags: combo('f-tags').get(),
    grupos: grupos('#f-grupos', function (row) {
      return {
        qtd: row.querySelector('.fq').value.trim(), unidade: row.querySelector('.fu')._combo.get(),
        ingrediente: row.querySelector('.fi')._combo.get(), obs: row.querySelector('.fo').value.trim(),
        aGosto: row.querySelector('.fg').checked,
      };
    }),
    passos: grupos('#f-passos', function (row) { return { passo: row.querySelector('textarea').value.trim() }; }),
  };
}

function salvar(btn) {
  var r = coletar(), msg = document.getElementById('f-msg');
  if (!r.nome) { msg.textContent = 'Dê um nome para a receita.'; return; }
  btn.disabled = true; btn.textContent = 'Salvando…'; msg.textContent = '';
  google.script.run
    .withSuccessHandler(function (res) {
      carregar(res.dados);
      estado.aberta = res.id; estado.fator = 1; estado.alt = {};

    })
    .withFailureHandler(function (e) {
      btn.disabled = false; btn.textContent = 'Salvar';
      msg.textContent = (e && e.message) || 'Erro ao salvar.';
    })
    .salvarReceita(r);
}

var MEDIDAS_CASEIRAS = ['fatia', 'dente', 'lata', 'pote', 'pacote', 'ramo', 'folha', 'maco', 'punhado', 'posta',
  'tablete', 'envelope', 'caixa', 'copo', 'gota', 'fio', 'pedaco', 'rodela', 'cubo', 'tira', 'vidro', 'sache', 'cabeca', 'talo', 'bandeja'];

function trocaFrac(s) { return String(s).replace(/[½⅓⅔¼¾⅛]/g, function (c) { return ' ' + FRAC_UNI[c]; }).replace(/(\d)\s+(\d\/)/, '$1 $2').trim(); }
function tiraEmoji(s) {
  return String(s).replace(/^[^\p{L}\p{N}(]+/u, '').replace(/[^\p{L}\p{N}).!?:]+$/u, '').trim();
}
function singular(w) {
  w = w.toLowerCase();
  if (/oes$/.test(norm(w))) return w.slice(0, -3) + 'ão';
  if (/(r|z|s)es$/.test(w)) return w.slice(0, -2);
  if (/s$/.test(w) && w.length > 3) return w.slice(0, -1);
  return w;
}
function minusc(t) { return t.length > 1 && t[1] === t[1].toLowerCase() ? t[0].toLowerCase() + t.slice(1) : t; }
function aliases(unidades) {
  var l = [];
  unidades.forEach(function (u) {
    var nomes = [u.nome, u.abrev, u.codigo.replace(/_/g, ' ')];
    if (/^colher/.test(u.nome)) nomes.push(u.nome.replace(/^colher/, 'colheres'));
    else if (u.nome.length > 2) nomes.push(u.nome + 's');
    nomes = nomes.concat(ALIAS_EXTRA[u.codigo] || []);
    nomes.forEach(function (n) { if (n) l.push({ a: norm(n), cod: u.codigo }); });
  });
  return l.sort(function (a, b) { return b.a.length - a.a.length; });
}
/** "1/2 cc" -> {qtd:'1/2', unidade:'colher_cha', resto:''}; "400 g de robalo" -> resto "robalo". */
function parseQtdUn(s, als, ingrediente) {
  s = trocaFrac(s);
  var m = s.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?)\s*/);
  if (!m) return null;
  var q = m[1].replace(/\s+/g, ' '), resto = s.slice(m[0].length), n = norm(resto), un = '';
  for (var i = 0; i < als.length; i++) {
    var a = als[i].a;
    if (n.indexOf(a) === 0 && (n.length === a.length || /[\s.,;:)]/.test(n.charAt(a.length)) || /\.$/.test(a))) {
      un = als[i].cod; resto = resto.slice(a.length); break;
    }
  }
  resto = resto.trim();
  if (!un) {
    var w = resto.match(/^(\S+)(?:\s+de\s+(.+)|$)/i);
    var cand = w ? singular(w[1]) : '';
    if (cand && MEDIDAS_CASEIRAS.indexOf(norm(cand)) > -1 && (w[2] || !ingrediente)) { un = cand; resto = w[2] || ''; }
    else if (!ingrediente && w && !w[2]) { un = cand; resto = ''; }
    else un = 'un';
  }
  resto = resto.replace(/^de\s+/i, '').trim();
  return { qtd: q, unidade: un, resto: resto };
}
function parseIngrediente(linha, als) {
  var t = trocaFrac(linha), it = { qtd: '', unidade: '', ingrediente: '', obs: '', aGosto: false };
  t = t.replace(/\(\s*s(?:ug(?:est[aã]o)?)?\.?:?\s*([^()]*)\)/i, function (m, q) {
    var p = parseQtdUn(q, als, false);
    if (p) { it.qtd = p.qtd; it.unidade = p.unidade; return ' '; }
    return m;
  });
  var obs = [];
  t = t.replace(/\(([^()]*)\)/g, function (m, o) { obs.push(o.trim()); return ' '; });
  it.obs = obs.join('; ');
  if (/(^|\s)a gosto(\s|$|[,.;])/i.test(t)) { it.aGosto = true; t = t.replace(/(^|\s)a gosto/i, ' '); }
  t = t.replace(/\s+/g, ' ').trim().replace(/[,;.:]$/, '').trim();
  if (!it.aGosto) {
    var p = parseQtdUn(t, als, true);
    if (p) { it.qtd = p.qtd; it.unidade = p.unidade; t = p.resto; }
  }
  it.ingrediente = minusc(t.replace(/^de\s+/i, '').trim());
  return it;
}
function mesmaQtd(it, p) {
  var a = qtdNum(it.qtd), b = qtdNum(p.qtd);
  return a != null && b != null && Math.abs(a - b) < 1e-6 && norm(it.unidade) === norm(p.unidade);
}
/** "(400 g)" no passo vira "{filé de robalo}" quando bate com a quantidade de um ingrediente. */
function marcarQtds(texto, ings, als) {
  return texto.replace(/\(\s*(s\.\s*)?([^()]+?)\s*\)/gi, function (m, s, dentro, pos) {
    var partes = dentro.split(','), q = partes.shift(), extra = partes.join(',').trim();
    var p = parseQtdUn(q, als, false);
    if (!p || p.resto) return m;
    var cands = ings.filter(function (it) { return mesmaQtd(it, p); });
    if (!cands.length) return m;
    var antes = norm(texto.slice(Math.max(0, pos - 50), pos));
    var it = cands.filter(function (c) {
      return norm(c.ingrediente).split(/[\s\-\/]+/).some(function (w) { return w.length > 2 && antes.indexOf(w) > -1; });
    })[0] || cands[0];
    return '{' + it.ingrediente + (extra ? ', ' + extra : '') + '}';
  });
}
function parseReceita(texto, unidades) {
  var als = aliases(unidades);
  var r = { nome: '', rendimento: '', obs: '', grupos: [], passos: [] };
  var sec = 'topo', g = null, p = null, passo = null, notas = [], nota = false;
  texto.replace(/\r/g, '').split('\n').forEach(function (bruta) {
    var l = bruta.trim();
    if (!l || /^[⸻—–_\-=~*·•.\s]+$/.test(l)) return;
    var marcador = /^([•\-*·▪◦●–]|\d+[.)](?=\s))/.test(l);
    var limpa = tiraEmoji(l.replace(/^([•\-*·▪◦●–]|\d+[.)](?=\s))\s*/, ''));
    var n = norm(limpa);
    if (!limpa) return;
    if (!marcador && /^ingredientes?\b/.test(n)) {
      sec = 'ing'; g = null;
      var rm = limpa.match(/\(([^)]*)\)/);
      if (rm) r.rendimento = rm[1].trim();
      return;
    }
    if (!marcador && /^(modo de preparo|preparo|modo de fazer|como fazer)\b/.test(n)) { sec = 'prep'; p = null; passo = null; nota = false; return; }
    if (sec === 'topo') {
      if (!r.nome) {
        var tm = limpa.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
        if (tm && tm[1]) { r.nome = tm[1]; notas.push(tm[2]); } else r.nome = limpa;
      } else notas.push(limpa);
      return;
    }
    if (sec === 'ing') {
      if (!marcador && /:$/.test(limpa)) { g = { nome: limpa.replace(/:$/, '').trim(), itens: [] }; r.grupos.push(g); return; }
      if (!g) { g = { nome: '', itens: [] }; r.grupos.push(g); }
      g.itens.push(parseIngrediente(limpa, als));
      return;
    }
    if (/^👉/.test(l) || nota) { nota = true; notas.push(limpa); return; }
    if (!marcador && /:$/.test(limpa) && limpa.length < 40) { p = { nome: limpa.replace(/:$/, '').trim(), itens: [] }; r.passos.push(p); passo = null; return; }
    if (!p) { p = { nome: '', itens: [] }; r.passos.push(p); }
    if (marcador || !passo) { passo = { passo: limpa }; p.itens.push(passo); }
    else passo.passo += ' ' + limpa;
  });
  r.obs = notas.join('\n');
  var ings = [];
  r.grupos.forEach(function (gr) { gr.itens.forEach(function (it) { ings.push(it); }); });
  r.passos.forEach(function (gr) { gr.itens.forEach(function (ps) { ps.passo = marcarQtds(ps.passo, ings, als); }); });
  return r;
}
